name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Fast suite (pnpm check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        # Git LFS art sources are not needed by the fast suite.

      - name: Set up pnpm
        # Version comes from the root package.json "packageManager" field.
        uses: pnpm/action-setup@v6

      - name: Set up Node.js with the pnpm store cache
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fast suite
        run: pnpm check
